# Simple three-node cluster: one controller, two workers.
#
# Run `zcc validate examples/simple-cluster.yaml` to verify this file.
# Run `zcc plan    examples/simple-cluster.yaml` to preview the deployment.
# Run `zcc deploy  examples/simple-cluster.yaml` to deploy.
#
# Feature entries may be defined inline (as below) or referenced externally:
#
#   By URI — load from a separate file:
#     features:
#       - uri: ./features/monitoring.yaml
#
#   By name — shorthand that resolves to features/<name>.yaml next to this file:
#     features:
#       - name: monitoring

name: simple-cluster
version: v1

hosts:
  - name: controller-1
    uri: 192.168.1.10
    labels: [controller, primary]
    ssh:
      user: ubuntu
      port: 22
      key: ~/.ssh/id_rsa

  - name: worker-1
    uri: 192.168.1.11
    labels: [worker, compute, storage]
    ssh:
      user: ubuntu
      key: ~/.ssh/id_rsa
    storage:
      - role: data
        location: /data
        permissions: rw
    limits:
      - role: cpu
        percent: 0.80
      - role: ram
        percent: 0.75

  - name: worker-2
    uri: 192.168.1.12
    labels: [worker, compute]
    ssh:
      user: ubuntu
      key: ~/.ssh/id_rsa
    limits:
      - role: cpu
        percent: 0.80

features:
  - name: monitoring
    labels: [primary, compute]
    locations:
      - ./features/monitoring
    install-cmds:
      - helm upgrade --install prometheus ./prometheus --namespace monitoring --create-namespace
    init-cmds:
      - kubectl apply -f ./dashboards

  - name: storage-backend
    labels: [storage]
    locations:
      - ./features/storage
    install-cmds:
      - helm upgrade --install longhorn ./longhorn --namespace longhorn-system --create-namespace

config:
  - ./config/cluster-settings.yaml

# Backend-specific deployment configuration.
#
# arguments: forwarded as CLI flags to every `k0s install controller/worker` call.
# k0s.yaml:  uploaded to /etc/k0s/k0s.yaml on every node during install.
#            Value may be inline YAML (block scalar) or a local filesystem path.
backend:
  arguments:
    --network: calico
  k0s.yaml: |
    apiVersion: k0s.k0sproject.io/v1beta1
    kind: ClusterConfig
    metadata:
      name: simple-cluster
    spec:
      network:
        provider: kuberouter
        kubeRouter:
          autoMTU: true
          extraArgs:
            overlay: "off"
