# Single-node cluster: one 'sole' node acts as both controller and worker.
# Useful for development, testing, or truly resource-constrained deployments.

name: sole-node-cluster
version: v1

hosts:
  - name: sole-1
    uri: 10.0.0.1
    roles: [sole]
    labels: [all]
    ssh:
      user: root
      key: ~/.ssh/id_rsa

features:
  - name: core-addons
    roles: [sole]
    install-cmds:
      - kubectl apply -f https://raw.githubusercontent.com/kubernetes/dashboard/v2.7.0/aio/deploy/recommended.yaml
